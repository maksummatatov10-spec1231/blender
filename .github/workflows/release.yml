name: Publish GEO STORY v2 release

on:
  push:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout deliverables
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify every V2 asset is present
        shell: bash
        run: |
          set -euo pipefail
          for f in geo_story_v2.mp4 geo_story_v2.blend renders_v2_frames.zip \
                   RELEASE_NOTES_V2.md lab/data/qa.json \
                   renders/v2/screenshots/contact_sheet.png \
                   renders/v2/screenshots/all_frames.png \
                   renders/v2/screenshots/qa_trajectory.png \
                   renders/v2/screenshots/arch_pass.png \
                   renders/v2/screenshots/skeleton.png \
                   renders/v2/screenshots/motion_paths.png \
                   renders/v2/screenshots/diagnostics.png \
                   renders/v2/screenshots/frame_0001.png \
                   renders/v2/screenshots/frame_0054.png \
                   renders/v2/screenshots/frame_0089.png \
                   renders/v2/screenshots/frame_0169.png \
                   renders/v2/screenshots/frame_0220.png \
                   renders/v2/screenshots/frame_0240.png \
                   renders/v2/frames_preview/frame_0001.jpg \
                   renders/v2/frames_preview/frame_0240.jpg; do
            test -s "$f" || { echo "MISSING $f"; exit 1; }
            echo "OK $(stat -c%s "$f") $f"
          done

      - name: Create release with MP4, .blend, images and frame archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="geo-story-v2.0"
          URL="https://github.com/${REPO}/releases/tag/${TAG}"
          git push origin --delete "refs/tags/${TAG}" 2>/dev/null || true
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" \
            --title "GEO STORY v2 — Красный идёт в гости к Синему" \
            --notes-file RELEASE_NOTES_V2.md \
            geo_story_v2.mp4 \
            geo_story_v2.blend \
            renders_v2_frames.zip \
            lab/data/qa.json \
            renders/v2/screenshots/contact_sheet.png \
            renders/v2/screenshots/all_frames.png \
            renders/v2/screenshots/qa_trajectory.png \
            renders/v2/screenshots/arch_pass.png \
            renders/v2/screenshots/skeleton.png \
            renders/v2/screenshots/motion_paths.png \
            renders/v2/screenshots/diagnostics.png \
            renders/v2/screenshots/frame_0001.png \
            renders/v2/screenshots/frame_0054.png \
            renders/v2/screenshots/frame_0089.png \
            renders/v2/screenshots/frame_0169.png \
            renders/v2/screenshots/frame_0220.png \
            renders/v2/screenshots/frame_0240.png
          echo "$URL" > release_url_v2.txt
          echo "RELEASE_URL=$URL" | tee -a "$GITHUB_ENV"
          gh release view "$TAG" --repo "$REPO" --json url,tagName,assets --jq '.url, (.assets[].name)'

      - name: Record the V2 release URL in the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add release_url_v2.txt
          git commit -m "docs: record GEO STORY v2 release URL [skip ci]" || echo "nothing to commit"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
