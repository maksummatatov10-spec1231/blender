name: Probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Write marker and push back
        run: |
          set -euo pipefail
          echo "probe ok $(date -u +%FT%TZ) ref=${GITHUB_REF}" > probe_result.txt
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "chore: probe from Actions [skip ci]" || echo "nothing to commit"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
