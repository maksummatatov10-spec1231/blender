name: Bundle Debian-12-compatible Blender runtime libs

on:
  push:
    paths:
      - '.github/workflows/libs.yml'

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install X11 / GL runtime (glibc 2.35, compatible with Debian 12)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libgbm1 libdrm2 \
            libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 \
            libx11-6 libxext6 libxcb1 libx11-xcb1 libxau6 libxdmcp6 \
            libxrandr2 libxinerama1 libxcursor1 libxxf86vm1 libxshmfence1 \
            libexpat1 libuuid1 libbsd0 libmd0 libglapi-mesa
          ldd --version | head -1

      - name: Bundle the exact missing shared objects + Mesa software driver
        shell: bash
        run: |
          set -euo pipefail
          L=/usr/lib/x86_64-linux-gnu
          mkdir -p syslibs22/dri
          NAMES="libGL.so.1 libGLX.so.0 libGLX_mesa.so.0 libGLdispatch.so.0 \
            libEGL.so.1 libEGL_mesa.so.0 libgbm.so.1 libdrm.so.2 libglapi.so.0 \
            libXrender.so.1 libXfixes.so.3 libXi.so.6 libxkbcommon.so.0 \
            libSM.so.6 libICE.so.6 libX11.so.6 libX11-xcb.so.1 libXext.so.6 \
            libxcb.so.1 libXau.so.6 libXdmcp.so.6 libXrandr.so.2 \
            libXinerama.so.1 libXcursor.so.1 libXxf86vm.so.1 libxshmfence.so.1 \
            libuuid.so.1 libexpat.so.1 libbsd.so.0 libmd.so.0 \
            libxcb-dri3.so.0 libxcb-present.so.0 libxcb-sync.so.1 \
            libxcb-xfixes.so.0 libxcb-glx.so.0 libxcb-shm.so.0 libxcb-dri2.so.0"
          for n in $NAMES; do
            if [ -e "$L/$n" ]; then cp -L "$L/$n" "syslibs22/$n"; fi
          done
          cp -L "$L"/dri/swrast_dri.so syslibs22/dri/ || true
          find syslibs22 -type f | wc -l
          du -sh syslibs22
          tar czf syslibs22.tar.gz syslibs22

      - name: Push compatible libs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add syslibs22.tar.gz
          git commit -m "chore: Debian-compatible X11/GL libs for Blender 5.3 [skip ci]"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
